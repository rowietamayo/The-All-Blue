kind = "web"
previewPath = "/"
title = "Sanji's All Blue"
version = "1.0.0"
id = "artifacts/all-blue"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20610

[services.development]
run = "pnpm --filter @workspace/all-blue run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/all-blue", "run", "build" ]
publicDir = "artifacts/all-blue/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20610"
BASE_PATH = "/"
